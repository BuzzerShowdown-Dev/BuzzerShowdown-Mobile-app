
workflows:
  buzzer-companion-ios:
    name: Buzzer Companion iOS (unsigned)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 22.13.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate iOS project
        script: CI=1 npx expo prebuild --platform ios

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        script: |
          set -e

          WORKSPACE="$(find ios -maxdepth 2 -name '*.xcworkspace' -print -quit)"

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No Xcode workspace found!"
            exit 1
          fi

          echo "Found workspace: $WORKSPACE"

          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; d=json.load(sys.stdin); x=d.get("workspace") or d.get("project") or {}; s=x.get("schemes", []); print(s[0] if s else "")')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No Xcode scheme found!"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi

          echo "Using scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e

          echo "Searching for compiled iOS app..."

          APP_PATH="$(find "$CM_BUILD_DIR/build/ios" -type d -name '*.app' -path '*/Release-iphoneos/*' -print -quit 2>/dev/null || true)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Compiled iOS app not found!"
            echo "Available app bundles:"
            find "$CM_BUILD_DIR/build/ios" -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"

          cd "$CM_BUILD_DIR/ipa"
          zip -r "$CM_BUILD_DIR/Buzzer-Companion-unsigned.ipa" Payload

          echo "Unsigned IPA packaged successfully!"

    artifacts:
      - Buzzer-Companion-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
